<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PAR-ADA Parking</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

/* TITLE SCREEN */
#titleScreen {
    width: 100%;
    height: 100vh;
    background: #e6e6e6;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

/* TITLE IMAGE */
.title-image {
    width: 1050px;
    
}

/* SUBTITLE */
.subtitle {
    margin-top: -100px;
    font-size: 20px;
    color: #2c4f7c;
    font-style: italic;
}

/* ENTER BUTTON */
.enter-btn {
    margin-top: 40px;
    padding: 12px 30px;
    font-size: 18px;
    border: none;
    background: #6aa0d8;
    color: white;
    border-radius: 8px;
    cursor: pointer;
    transition: 0.3s;
}

.enter-btn:hover {
    background: #4f84b8;
}

/* MAIN CONTENT */
#main {
    display: none;
    padding: 40px;
    text-align: center;
}
</style>
</head>

<body>

<!-- TITLE SCREEN -->
<div id="titleScreen">

    <!-- 🔽 YOUR FULL TITLE IMAGE HERE -->
    <img src="logo.png" alt="PAR-ADA Logo" class="title-image">

    <!-- ONLY TEXT LEFT -->
    <div class="subtitle">A Parking Website for PSHS-CARC</div>

    <!-- ENTER BUTTON -->
    <button class="enter-btn" onclick="enterSite()">Enter</button>

</div>

<!-- MAIN WEBSITE -->
<div id="main">
    <h1>Welcome to PAR-ADA 🚗</h1>
    <p>Your parking system is ready!</p>
</div>

<script>
function enterSite() {
    window.location.href = "home.html";
}
</script>

</body>
</html>
