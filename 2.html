<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 40px 40px;
    background: #e6e6e6;
}

.logo img {
    height: 100px;
}

.nav-links {
    display: flex;
    gap: 30px;
}

.nav-links a {
    text-decoration: none;
    color: black;
    font-weight: 500;
    font-size: 20px;
}

.nav-links a:hover {
    font-weight: bold;
}

.hero {
    min-height: 100vh;
    background: url('background.png') no-repeat center center/cover;
    position: relative;
    display: flex;
    justify-content: center;
    padding-top: 40px;
}

.hero::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0, 60, 120, 0.5);
    top: 0;
    left: 0;
}

.content {
    position: relative;
    z-index: 1;
    width: 70%;
}

.search-box {
    display: flex;
    margin-bottom: 20px;
}

.search-box input {
    flex: 1;
    padding: 15px;
    border: none;
    font-size: 18px;
}

.search-box button {
    background: #f4b400;
    border: none;
    padding: 15px 20px;
    cursor: pointer;
}

.glass {
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
}

.card {
    width:140%;
    display: flex;
    margin-bottom: 25px;
    border-radius: 20px;
    overflow: hidden;
    padding: 30px;
}

.card-left {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 25px;
}

.green { background: #a6df2f; }
.yellow { background: #f2d35e; }

.icon { font-size: 60px; }

.card-text h2 { font-size: 30px; }
.card-text p { font-size: 18px; }

.fee {
    margin-top: 10px;
    background: #eee;
    padding: 6px;
    border-radius: 20px;
    width: 350px;
    text-align: center;
}

.card-right {
    width: 200px;
    background: #6aa0d8;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.card-right p { font-size: 20px; }
.card-right h1 { font-size: 50px; }
</style>
</head>

<body>

<div class="navbar">

            <img src="logo.png">
        </div>
    </a>

<div class="card">

<div class="card-text">
<h2>PSHS-CARCBC</h2>

<div class="fee">Parking Fee: 0</div>
</div>
</div>

<div class="card-right">
<p>Bakante:</p>
<h1>10</h1>

</div>

<button onclick="any()" style="all: unset; cursor: pointer;">

</div>

<div class="card-right">
<p>Bakante:</p>
<h1>2</h1>

</div>
</div>
</div>
</div>

</html>

    </div>

</div>

<!-- ================= ONLY JS ADDED ================= -->
<script>
function showPage(pageId){
    document.getElementById("page1").style.display = "none";
    document.getElementById("page2").style.display = "none";
    document.getElementById("page3").style.display = "none";

    document.getElementById(pageId).style.display = "block";
}

/* NAVIGATION (REPLACED ONLY REDIRECTS) */
function irisan(){ showPage("page2"); }
function any(){ showPage("page2"); }
function GoToUpdteSlts(){ showPage("page3"); }
function GoToMngInfo(){ showPage("page2"); }

/* SLOT LOGIC (UNCHANGED) */
let occupied = 0;
const maxSlots = 30;

function updateDisplay() {
    document.getElementById("occupied").innerText = occupied;
    document.getElementById("remaining").innerText = maxSlots - occupied;
}

function increase() {
    if (occupied < maxSlots) {
        occupied++;
        updateDisplay();
    }
}

function decrease() {
    if (occupied > 0) {
        occupied--;
        updateDisplay();
    }
}
</script>
